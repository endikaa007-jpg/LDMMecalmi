<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almi Birds — Registro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/registro.css" />
</head>
<body>

    <div class="pagina-acceso">

        <div class="logo-acceso">Almi Birds</div>
        <p class="subtitulo-acceso">Crear cuenta</p>

        <div class="contenedor-formulario">

            <div id="paso1">
                <h3>Paso 1 — Acceso</h3>

                <div class="parFormulario">
                    <label for="usuario">Usuario *</label>
                    <input type="text" id="usuario" placeholder="Mínimo 3 caracteres" autocomplete="username" />
                </div>

                <div class="parFormulario">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" />
                </div>

                <div class="parFormulario">
                    <label for="contrasena">Contraseña * (mín. 6 caracteres)</label>
                    <input type="password" id="contrasena" placeholder="••••••••" />
                </div>

                <div class="parFormulario">
                    <label for="recontrasena">Repetir contraseña *</label>
                    <input type="password" id="recontrasena" placeholder="••••••••" />
                </div>

                <button class="btn btn-primario btn-full" id="btnSiguiente">Siguiente</button>

                <div class="separador">¿Ya tienes cuenta?</div>
                <a href="login.html" class="btn btn-secundario btn-full">Iniciar sesión</a>
            </div>

            <div id="paso2" style="display:none;">
                <h3>Paso 2 — Perfil</h3>

                <div class="parFormulario">
                    <label for="editPais">País</label>
                    <input type="text" id="editPais" placeholder="España, México..." />
                </div>

                <div class="parFormulario">
                    <label for="avatarArchivo">Foto de perfil</label>
                    <input type="file" id="avatarArchivo" accept="image/*" />
                    <img id="avatarPreview" class="avatar-preview"
                         src="img/avatar_defecto.png"
                         alt="Preview avatar" />
                </div>

                <div class="fila-botones">
                    <button class="btn btn-secundario" id="btnAnterior">Volver</button>
                    <button class="btn btn-primario" id="btnRegistrar">Registrarse</button>
                </div>
            </div>

        </div>

        <div id="mensajesAlerta"></div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
