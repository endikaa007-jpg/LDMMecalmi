<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- preconnect para que el navegador conecte con Google Fonts antes de necesitarlas -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- carga de fuentes en el head para evitar el destello de texto sin estilo -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almi Birds — Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
</head>
<body>

    <div class="pagina-acceso">

        <div class="logo-acceso">Almi Birds</div>
        <p class="subtitulo-acceso">Plataforma de puntuaciones</p>

        <div class="contenedor-formulario">
            <h3>Iniciar sesión</h3>

            <div class="parFormulario">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Tu nombre de usuario" autocomplete="username" />
            </div>

            <div class="parFormulario">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="••••••••" autocomplete="current-password" />
            </div>

            <button class="btn btn-primario btn-full" id="btnLogin">Entrar</button>

            <div class="separador">o</div>

            <a href="registro.html" class="btn btn-secundario btn-full">
                Crear cuenta nueva
            </a>
        </div>

        <div id="mensajesAlerta"></div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
